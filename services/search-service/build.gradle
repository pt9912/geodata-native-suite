
plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
    id 'application'
    id 'io.micronaut.application' version '4.4.4'
    id 'io.micronaut.aot' version '4.4.4'
}

group = 'io.geodata'
version = '0.1.0'
sourceCompatibility = JavaVersion.VERSION_24
targetCompatibility = JavaVersion.VERSION_24
repositories { mavenCentral() }

ext { 
    javaVersion = 24
    micronautTracingVersion = '7.1.4'
    micronautRedisVersion = '6.8.0'
    micronautCacheCoreVersion = '5.3.0'
}

micronaut {
    version '4.9.2'
    runtime 'netty'
    processing { incremental true }
    aot {
        optimizeServiceLoading = true
        convertYamlToJava = true
        precomputeOperations = true
    }
}
dependencies {
    implementation platform("io.micronaut:micronaut-core-bom")
    annotationProcessor platform("io.micronaut:micronaut-core-bom")

    implementation "io.micronaut.redis:micronaut-redis-lettuce:${micronautRedisVersion}"
    implementation "io.micronaut.cache:micronaut-cache-core:${micronautCacheCoreVersion}"

    annotationProcessor "io.micronaut:micronaut-http-validation"
    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut.serde:micronaut-serde-jackson:2.10.2"
    implementation "io.micronaut.tracing:micronaut-tracing-opentelemetry-http:7.1.4"
    implementation "io.micronaut.data:micronaut-data-jdbc:4.13.4"
    implementation("io.micronaut.kafka:micronaut-kafka")

    runtimeOnly "org.postgresql:postgresql:42.7.4"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"

    implementation("org.xerial:sqlite-jdbc:3.46.0.1")

    implementation("io.micronaut:micronaut-jackson-databind")
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
        
    implementation("jakarta.annotation:jakarta.annotation-api:2.1.1")
    implementation("jakarta.validation:jakarta.validation-api:3.1.1")

    runtimeOnly("ch.qos.logback:logback-classic:1.4.14")
}

application {
    mainClass = "io.geodata.search.Application"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
}
