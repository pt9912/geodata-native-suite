
plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
    id 'application'
    id 'io.micronaut.application' version '4.4.4'
    id 'io.micronaut.aot' version '4.4.4'
}

group = 'io.geodata'
version = '0.1.0'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
repositories { mavenCentral() }


ext { 
    micronautVersion = '4.9.10' 
    micronautTracingVersion = '7.1.4'
}

micronaut {
    version '4.9.10'
    runtime 'netty'
    processing { incremental true }
    aot {
        optimizeServiceLoading = true
        convertYamlToJava = true
        precomputeOperations = true
    }
}
dependencies {
    implementation(platform("io.micronaut.tracing:micronaut-tracing-bom:${micronautTracingVersion}"))
    implementation(platform("io.micronaut:micronaut-core-bom:${micronautVersion}"))
    annotationProcessor "io.micronaut:micronaut-http-validation"
    implementation "io.micronaut:micronaut-http-server-netty"
    implementation "io.micronaut.serde:micronaut-serde-jackson:2.10.2"
    implementation "io.micronaut.tracing:micronaut-tracing-opentelemetry-http"
implementation "io.micronaut.cache:micronaut-cache-redis:5.6.0"
    implementation "io.micronaut.data:micronaut-data-jdbc"
    runtimeOnly "org.postgresql:postgresql:42.7.4"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
}

application {
    mainClass = "io.geodata.search.Application"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
