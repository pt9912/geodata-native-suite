
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=slice_cache:10m max_size=5g inactive=1h use_temp_path=off;
  proxy_cache_key "$scheme$request_method$host$request_uri";

  map $http_range $slice_range { default $http_range; }

  upstream minio {
    server minio:9000;
  }

  server {
    listen 8080 default_server;
    server_name _;

    location /health {
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    location ~ ^/s3/(?<bucket>[^/]+)/(?<path>.+)$ {
      internal;
      resolver 127.0.0.11 valid=10s;

      set $upstream_url http://minio:9000/$bucket/$path$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host minio:9000;
      proxy_set_header X-Accel-Buffering no;

      slice 1m;
      proxy_cache slice_cache;
      proxy_cache_valid 200 206 1h;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_client_abort on;

      proxy_pass $upstream_url;
      proxy_force_ranges on;
      add_header X-Cache $upstream_cache_status;
    }
  }
}
