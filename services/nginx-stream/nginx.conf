user  nginx;
worker_processes auto;
events { worker_connections 10240; }
http {
  resolver 127.0.0.11 ipv6=off valid=300s;

  # Log ohne Query-String
  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" up:$upstream_status cache:$upstream_cache_status rt:$request_time urt:$upstream_response_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  sendfile on; tcp_nopush on; aio threads;
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=stream_cache:200m max_size=10g inactive=2h use_temp_path=off;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  proxy_cache_revalidate on;

  map $http_range $req_range { "~bytes=" $http_range; default ""; }

  # Host-Parsing aus ?u=... (presigned URL)
  map $arg_u $relay_host {
    default "";
    ~^https?://(?<h>[^/]+)/ $h;
  }

  # Allow-List (nur S3/AmazonAWS Beispiele — erweiterbar über Regex)
  map $relay_host $relay_ok {
    default 0;
    ~(^|\.)amazonaws\.com$ 1;
    ~(^|\.)s3\.[^./]+\.amazonaws\.com$ 1;
  }

  server {
    location /nginx_status { stub_status; access_log off; allow all; }

    listen 8080;
    underscores_in_headers on;
    client_max_body_size 0;

    # Search PG (default)
    location /stac/   { proxy_pass http://search-pg:8080/stac/;   proxy_set_header Host $host; }
    location /search/ { 
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header x-request-id $request_id;
      proxy_pass http://search-pg:8080/;        proxy_set_header Host $host; }

    # Search SQLite (light)
    location /sqlite/stac/   { proxy_pass http://search-sqlite:8080/stac/; proxy_set_header Host $host; }
    location /sqlite/search/ { 
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header x-request-id $request_id;
      proxy_pass http://search-sqlite:8080/;      proxy_set_header Host $host; }

    # Fetch relay
    location /download/ {
      
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_set_header x-request-id $request_id;
      proxy_pass http://fetch:5000;
      proxy_set_header X-Original-URI $request_uri;
      proxy_buffering off;
    }

    # Interner Relay – streng validiert
    location /internal/relay {
      internal;
      if ($arg_u = "") { return 400; }
      if ($relay_ok = 0) { return 403; }

      set $target $arg_u;
      proxy_ssl_server_name on; proxy_ssl_name $proxy_host;

      # Slice-Cache
      slice 2m;
      proxy_cache stream_cache;
      proxy_cache_key $target$req_range;
      proxy_cache_valid 200 206 2h;
      proxy_no_cache $upstream_http_set_cookie $http_authorization;
      proxy_ignore_headers Set-Cookie Expires;
      add_header X-Cache $upstream_cache_status always;

      proxy_set_header Range $req_range;
      proxy_set_header Host $relay_host;
      proxy_pass $target;
      proxy_buffering on;
    }

    location = /health { return 200 "OK\n"; add_header Content-Type text/plain; }
  }
}
