---
extends: default

ignore: |
  charts/*/templates/*.yaml
  charts/*/templates/*.yml

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
    check-keys: false
  indentation:
    indent-sequences: consistent
  document-start:
    present: true
  new-line-at-end-of-file:
    present: true
