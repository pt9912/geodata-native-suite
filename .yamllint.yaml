---
extends: default

ignore: |
  deploy/charts/*/templates/*.yaml
  deploy/charts/*/templates/*.yml

yaml-files:
  - values*.y?(a)ml
  - rendered/*.y?(a)ml
  
rules:
  # statt: new-line-at-end-of-file: {present: true}
  new-line-at-end-of-file: enable

  # deine restlichen Regeln:
  line-length: disable
  document-start: disable
  braces:
    max-spaces-inside: 0
  colons:
    max-spaces-after: 1
