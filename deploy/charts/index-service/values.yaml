---
replicaCount: 2

image:
  repository: ghcr.io/pt9912/geodata-native-suite/index-service:geodata-6
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  clusterIssuer: "letsencrypt-dns01"
  annotations: {}
  hosts:
    - host: "replace-me.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tls-secret
      hosts: ["replace-me.example.com"]

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 70
pdb:
  enabled: true
  minAvailable: "50%"


envFrom: []    # secrets/configmaps
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

configMap:
  name: index-service-configmap
  mountPath: /etc/config          # Zielverzeichnis im Container
  schemaFileName: stac-avro-schema.json  # Dateiname in der ConfigMap
extraEnvVars:
  - name: KAFKA_BOOTSTRAP
    value: redpanda.infra.svc:9092
  - name: DB_DIALECT
    value: postgres
  - name: DB_HOST
    value: postgres
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: geodata
  - name: DB_USER
    value: app
  - name: DB_PASSWORD
    value: apppw
