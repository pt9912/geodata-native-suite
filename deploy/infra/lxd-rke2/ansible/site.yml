---
# Erwartet im Inventory: Gruppen [masters] und [workers]
# Variablen:
#   primary_master: <Hostname des primären Masters>  (z.B. "master-01")

- name: Validate primary master
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure primary_master is defined and valid
      assert:
        that:
          - primary_master is defined
          - primary_master in groups['masters']
        fail_msg: "primary_master must be a valid host in group 'masters'"

- name: Build cluster facts (once)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Compute master IP list from inventory
      set_fact:
        master_ips: "{{ groups['masters'] | map('extract', hostvars, 'ansible_host') | list }}"
    # - name: Pick primary master IP
    #   set_fact:
    #     primary_master_ip: "{{ hostvars[primary_master].ansible_host }}"
    - name: Get primary_master's ansible_ssh_host IP
      set_fact:
        primary_master_ip: "{{ ansible_ssh_host }}"
      delegate_to: "{{ primary_master }}"

- name: Prepare all nodes (base OS)
  hosts: all
  become: true
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - open-iscsi
          - nfs-common
          - util-linux
          - bash
          - cryptsetup
          - dmsetup
        state: present

    - name: Ensure iscsid running and enabled
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true

- name: Prepare master nodes
  hosts: masters
  tasks:
   - name: Install RKE2 binaries
     become: true
     ansible.builtin.shell:
       cmd: curl -sfL https://get.rke2.io | sh -
       creates: /usr/local/bin/rke2
   - name: Collect the addresses of all master nodes
     set_fact:
       master_ips: "{{ master_ips | default([]) + [ansible_ssh_host] }}"
     delegate_to: "{{ item }}"
     with_inventory_hostnames: masters

- name: Install RKE2 on master nodes
  hosts: masters
  become: true
  tasks:
    - name: Install RKE2 server binaries (idempotent)
      ansible.builtin.shell:
        cmd: curl -sfL https://get.rke2.io | sh -
        creates: /usr/local/bin/rke2
    - name: Create RKE2 config dir
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

- name: Seed primary master
  #hosts: "{{ hostvars['localhost']['primary_master'] }}"
  hosts: masters
  become: true
  tasks:
    - name: Write primary rke2 config
    # Achtung: Einrückung der Listen!
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0644"
        content: |
          cni: calico
          tls-san:
            {{ master_ips | to_nice_yaml(indent=2) | indent(2) }}
          node-external-ip:
            - "{{ ansible_host }}"
          node-ip:
            - "{{ ansible_host }}"
    - name: Enable & start rke2-server
      ansible.builtin.service:
        name: rke2-server
        state: started
        enabled: true

- name: Read cluster token from primary
  hosts: masters
  become: true
  gather_facts: false
  tasks:
    - name: Read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: node_token_b64

    - name: Distribute master_url and node_token as delegated facts to all nodes
      ansible.builtin.set_fact:
        master_url: "https://{{ hostvars[inventory_hostname].ansible_host }}:9345"
        node_token: "{{ node_token_b64.content | b64decode | trim }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"
      vars:
        # We want the primary master's IP inside master_url, not the loop host's
        inventory_hostname: "{{ primary_master }}"

- name: Join secondary masters
  hosts: masters
  become: true
  serial: 1
  tasks:
    - name: Skip on primary master
      ansible.builtin.meta: end_host
      when: inventory_hostname == primary_master

    - name: Write rke2 config for joining master
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0644"
        content: |
          server: "{{ hostvars[inventory_hostname].master_url }}"
          token: "{{ hostvars[inventory_hostname].node_token }}"
          cni: calico
          tls-san:
            {{ hostvars['localhost'].master_ips | to_nice_yaml(indent=2) | indent(2) }}
          node-external-ip:
            - "{{ ansible_host }}"
          node-ip:
            - "{{ ansible_host }}"

    - name: Enable & start rke2-server
      ansible.builtin.service:
        name: rke2-server
        state: started
        enabled: true

- name: Install RKE2 on workers
  hosts: workers
  become: true
  tasks:
    - name: Install RKE2 agent binaries (idempotent)
      ansible.builtin.shell:
        cmd: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE="agent" sh -
        creates: /usr/local/bin/rke2
    - name: Create RKE2 config dir
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"
    - name: Write rke2 agent config
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0644"
        content: |
          server: "{{ hostvars[inventory_hostname].master_url }}"
          token: "{{ hostvars[inventory_hostname].node_token }}"
          node-external-ip:
            - "{{ ansible_host }}"
          node-ip:
            - "{{ ansible_host }}"
    - name: Enable & start rke2-agent
      ansible.builtin.service:
        name: rke2-agent
        state: started
        enabled: true
# 1) Kubeconfig auf dem Primary finden und zum Controller kopieren
- name: Pull kubeconfig from primary master
  hosts: masters
  become: true
  gather_facts: false
  vars:
    pm: "{{ primary_master | default(groups['masters'][0]) }}"
    tmp_dest: "/tmp/rke2_kubeconfig_{{ pm }}.yaml"
  tasks:
    - name: Run only on primary master
      ansible.builtin.meta: end_host
      when: inventory_hostname != pm

    - name: Prefer /etc/rancher/rke2/rke2.yaml
      ansible.builtin.stat:
        path: /etc/rancher/rke2/rke2.yaml
      register: kc1

    - name: Determine kubeconfig source (fallback to admin.kubeconfig)
      ansible.builtin.set_fact:
        kubeconfig_source: >-
          {{ '/etc/rancher/rke2/rke2.yaml'
             if kc1.stat.exists else
             '/var/lib/rancher/rke2/server/cred/admin.kubeconfig' }}

    - name: Fetch kubeconfig to controller
      ansible.builtin.fetch:
        src: "{{ kubeconfig_source }}"
        dest: "{{ tmp_dest }}"
        flat: true

# 2) Lokal patchen und unter ~/.kube/config ablegen
- name: Install kubeconfig on controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    pm: "{{ primary_master | default(groups['masters'][0]) }}"
    tmp_dest: "/tmp/rke2_kubeconfig_{{ pm }}.yaml"
  tasks:
    - name: Read fetched kubeconfig
      ansible.builtin.slurp:
        src: "{{ tmp_dest }}"
      register: kc_local

    # wir haben hier bereits: kc_local.content (b64)
    - name: Erwartete Server-URL bauen
      ansible.builtin.set_fact:
        expected_server: "https://{{ hostvars[pm].ansible_host }}:6443"
        kubeconfig_raw: "{{ kc_local.content | b64decode }}"

    - name: Kubeconfig als YAML parsen
      ansible.builtin.set_fact:
        kubeconfig_parsed: "{{ kubeconfig_raw | from_yaml }}"

    # Alle Cluster-Server hart auf expected_server setzen
    - name: Cluster-Einträge patchen (server -> expected_server)
      ansible.builtin.set_fact:
        patched_clusters: >-
          {{ kubeconfig_parsed.clusters
            | map('combine', {'cluster': {'server': expected_server}}, recursive=True)
            | list }}

    - name: Zusammenführen und wieder zu YAML serialisieren
      ansible.builtin.set_fact:
        kubeconfig_parsed: "{{ kubeconfig_parsed | combine({'clusters': patched_clusters}, recursive=True) }}"
        kubeconfig_updated: "{{ kubeconfig_parsed | to_nice_yaml }}"

    - name: Patch server endpoint to primary IP (robust)
      ansible.builtin.set_fact:
        kubeconfig_updated: >-
          {{ kubeconfig_updated
            | regex_replace('(?m)^(\s*server:\s*)https://[^:]+:6443',
                            '\1https://' ~ hostvars[pm].ansible_host ~ ':6443') }}

    - name: Safety patch stray 127.0.0.1 endpoints (text-level)
      ansible.builtin.set_fact:
        kubeconfig_updated: >-
          {{ kubeconfig_updated
            | regex_replace('127\.0\.0\.1:6443', hostvars[pm].ansible_host ~ ':6443') }}

    # Für den Assert nochmal parsen
    - name: Re-parse kubeconfig after safety patch
      ansible.builtin.set_fact:
        kubeconfig_parsed: "{{ kubeconfig_updated | from_yaml }}"

    # Assert: fachlich korrekt (alle Cluster zeigen auf Primary-IP)
    - name: Server-URL prüfen (alle Cluster)
      vars:
        servers: "{{ kubeconfig_parsed.clusters | map(attribute='cluster.server') | list }}"
        expected_server: "https://{{ hostvars[pm].ansible_host }}:6443"
      ansible.builtin.assert:
        that:
          - servers | unique | length == 1
          - servers[0] == expected_server
        fail_msg: >-
          Server-URLs inkonsistent oder falsch: {{ servers }} – erwartet {{ expected_server }}.

    # Optional: Nur zur Transparenz – falls du den Text komplett „sauber“ haben willst:
    - name: Optional assert kein 127.0.0.1 mehr im Text
      ansible.builtin.assert:
        that:
          - "'127.0.0.1:6443' not in kubeconfig_updated"
        fail_msg: "In der Datei steht noch 127.0.0.1:6443 (kosmetisch)."
      ignore_errors: true   # <- nicht blockieren, wenn fachlich alles stimmt

    # Schreiben
    - name: Schreibe kubeconfig lokal
      ansible.builtin.copy:
        dest: "{{ lookup('env','HOME') }}/.kube/config"
        content: "{{ kubeconfig_updated }}"
        mode: '0644'




