- name: Install Longhorn via Helm
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    kubeconfig_path: "{{ lookup('env','HOME') }}/.kube/config"
  tasks:
    - name: Add Longhorn repo
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io
    # … unverändert …


    - name: Install/Upgrade Longhorn
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: longhorn-system
        create_namespace: true
        update_repo_cache: true
        chart_version: "1.9.1"
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 1
          defaultSettings:
            defaultDataPath: "/var/lib/longhorn"
            defaultReplicaCount: 1
            allowCollectingLonghornUsageMetrics: false
            # Deaktiviere iSCSI und verwende stattdessen das Dateisystem
            replicaFileSyncHttpClientProtocol: "filesystem"
            # Erhöhe Timeouts für stabilere Verbindungen
            replicaEngineReplicaTimeout: 120
            engineReplicaTimeout: 120
            # Deaktiviere automatische Reinigung von Replicas
            createDefaultDiskLabeledNodes: false
            # Verwende direkte Synchronisierung für bessere Performance in LXD
            replicaSoftAntiAffinity: false
            # Erzwinge keine iSCSI-Verbindungen
            disableReplicaRebuild: false
            # Erhöhe die Stabilität bei Netzwerkproblemen
            concurrentAutomaticEngineUpgradePerNodeLimit: 1