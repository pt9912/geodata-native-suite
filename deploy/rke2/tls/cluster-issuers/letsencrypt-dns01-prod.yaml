
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    email: noreply@auth.geo-terrain.net
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
    - dns01:
        webhook:
          groupName: acme.geo-terrain.net
          solverName: hetzner
          config:
            secretName: hetzner-dns
            zoneName: geo-terrain.net
            ttl: 60
