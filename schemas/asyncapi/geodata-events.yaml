---

asyncapi: 3.0.0
info:
  title: geodata-native-suite events
  version: 0.1.0
defaultContentType: application/avro
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
channels:
  stac.item.indexed:
    address: stac.item.indexed
    messages:
      StacItemIndexed:
        payload:
          $ref: ../avro/stac.item.indexed.avsc
  stac.item.updated:
    address: stac.item.updated
    messages:
      StacItemUpdated:
        payload:
          $ref: ../avro/stac.item.updated.avsc
  stac.item.deleted:
    address: stac.item.deleted
    messages:
      StacItemDeleted:
        payload:
          $ref: ../avro/stac.item.deleted.avsc
