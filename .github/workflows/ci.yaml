name: CI (geodata-native-suite)
on: { push: { branches: [ "main" ] }, pull_request: { branches: [ "main" ] } }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.15.3 }
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: Helm lint
        run: for c in charts/*; do [ -d "$c" ] && helm lint "$c"; done
      - name: YAML lint
        run: yamllint -d "{extends: default, rules: {line-length: disable}}" charts values deploy || true
