---
name: CI

on:
  push:
    branches: [ "main", "geodata-*", "release-*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yaml .

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint all charts
        run: |
          shopt -s nullglob
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "==> helm lint $chart"
              helm lint "$chart"
            fi
          done

  gradle-verify:
    name: Search-Service JVM build (sanity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Gradle build (if wrapper exists)
        run: |
          if [ -x "services/search-service/gradlew" ]; then
            (cd services/search-service && ./gradlew --no-daemon clean build -x test)
          else
            echo "gradlew not found in services/search-service (skipping)"
          fi

  python-sanity:
    name: Python services syntax & import smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps (optional)
        run: |
          set -e
          if [ -f services/index-service/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install --no-cache-dir --no-deps -r services/index-service/requirements.txt || true
          fi
          if [ -f services/fetch-service/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install --no-cache-dir --no-deps -r services/fetch-service/requirements.txt || true
          fi
      - name: Syntax check (py_compile)
        run: |
          python - <<'PY'
          import py_compile, sys, pathlib
          paths = [
            "services/index-service/app",
            "services/fetch-service/app"
          ]
          ok=True
          for base in paths:
            p = pathlib.Path(base)
            if p.exists():
              for f in p.rglob("*.py"):
                try:
                  py_compile.compile(str(f), doraise=True)
                  print(f"[OK] {f}")
                except Exception as e:
                  print(f"::error file={f}:: {e}")
                  ok=False
          sys.exit(0 if ok else 1)
          PY
      - name: Import smoke (non-fatal)
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib.util, os, traceback
          files = [
            "services/index-service/app/main.py",
            "services/fetch-service/app/main.py"
          ]
          for p in files:
            if os.path.exists(p):
              try:
                spec = importlib.util.spec_from_file_location("mod", p)
                m = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(m)  # type: ignore
                print(f"[OK] import {p}")
              except Exception as e:
                print(f"[WARN] import {p}: {e}\n{traceback.format_exc()}")
          PY
            PY