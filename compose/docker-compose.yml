
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.2
    container_name: redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "0.0.0.0:9092"
      - --advertise-kafka-addr
      - "redpanda:9092"
      - --schema-registry-addr
      - "0.0.0.0:8081"
    ports: ["9092:9092","8081:8081","9644:9644"]

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports: ["5672:5672","15672:15672"]

  # Postgres mit Archivierung
  postgres:
    build:
      context: ../postgres
    container_name: geodata-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodata}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppw}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../testdata/search-service/postgis-items.sql:/docker-entrypoint-initdb.d/postgis-items.sql:ro
    depends_on: [ minio ]

  # wal-g Sidecar (Demo)
  wal-g:
    image: ghcr.io/wal-g/wal-g:latest
    container_name: wal-g
    environment:
      WALG_S3_PREFIX: s3://${WALG_S3_BUCKET:-wal-g-backups}/pg
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      WALG_S3_ENDPOINT: ${WALG_S3_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_ACCESS_KEY:-minioadmin123}
      WALG_S3_FORCE_PATH_STYLE: ${WALG_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - pg_data:/var/lib/postgresql/data:ro
    depends_on: [ postgres, minio ]
    command: ["bash","-lc","echo 'Use postgres archive_command wal-g' && sleep infinity"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: geodata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ["9000:9000","9001:9001"]
    volumes: [ "minio_data:/data" ]

  # ---------- App Layer ----------
  fetch:
    build: ../services/fetch-service
    container_name: geodata-fetch
    environment:
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      DEMO_TOKEN: ${DEMO_TOKEN:-demo}
      CONFIG_FILE: /app/config/config.yaml
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
    ports:
      - "5000:5000"
    volumes:
      - ../services/fetch-service/config:/app/config:ro
    depends_on: [ redpanda ]

  search-sqlite:
    build:
      context: ../services/search-service
      dockerfile: Dockerfile.jvm
    container_name: geodata-search-sqlite
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:sqlite:/data/geodata.db
      REDIS_URI: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
    expose: ["8080"]
    depends_on: [ redis, redpanda ]

  search-pg:
    build:
      context: ../services/search-service
      dockerfile: Dockerfile.jvm
    container_name: geodata-search-pg
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geodata}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppw}
      REDIS_URI: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
    expose: ["8080"]
    depends_on: [ postgres, redis, redpanda ]

  index-api:
    build: 
      context: ../services/index-service
      dockerfile: Dockerfile
    container_name: index-api
    environment:
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-geodata}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppw}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      SCHEDULER_ENABLED: "true"
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      EDL_TOKEN: ${EDL_TOKEN:-}
      EDL_TOKEN_REFRESH_URL: ${EDL_TOKEN_REFRESH_URL:-}
      EDL_CLIENT_ID: ${EDL_CLIENT_ID:-}
      EDL_CLIENT_SECRET: ${EDL_CLIENT_SECRET:-}
    volumes:
      - ../services/index-service/config:/app/config:ro
      - ../schemas/avro:/app/schemas/avro:ro
      - ../data/tiles:/app/data/tiles:ro
    ports: ["8000:8000"]
    depends_on: [ redis, rabbitmq, redpanda, postgres ]

  worker:
    build: ../services/index-service
    container_name: index-worker
    command: ["celery","-A","app.celery_app.celery","worker","-Q","index","-l","INFO","--without-gossip","--without-mingle"]
    environment:
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-geodata}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppw}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      AWS_REGION: ${AWS_REGION:-eu-central-1}
    volumes:
      - ../services/index-service/config:/app/config:ro
      - ../schemas/avro:/app/schemas/avro:ro
      - ../data/tiles:/app/data/tiles:ro
    depends_on: [ redis, rabbitmq, redpanda, postgres ]

  beat:
    build: ../services/index-service
    container_name: index-beat
    command: ["celery","-A","app.celery_app.celery","beat","-l","INFO"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
    depends_on: [ worker ]

  fetch-worker:
    build: ../services/fetch-service
    container_name: fetch-worker
    command: ["celery","-A","app.celery_worker:celery_app","worker","--loglevel=INFO","-Q","fetch"]
    environment:
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      REQUEST_PAYER: ${REQUEST_PAYER:-}
    volumes:
      - ../services/fetch-service/config:/app/config:ro
    depends_on: [ fetch, redpanda, redis, minio ]

  nginx:
    image: nginx:1.27-alpine
    container_name: geodata-nginx
    depends_on: [ fetch, search-pg, search-sqlite, minio ]
    #command: ["/bin/sh","-c","rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    command: ["/bin/sh","-c","nginx -g 'daemon off;'"]
    ports: [ "${NGINX_PORT:-8080}:8080" ]
    volumes:
      - ../services/nginx-stream/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx


  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [ redpanda, nginx, postgres, redis ]

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [ prometheus, tempo ]

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../monitoring/tempo.yaml:/etc/tempo.yaml:ro
    ports: ["3200:3200"]

  otel-collector:
    image: otel/opentelemetry-collector:0.112.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports: ["4317:4317","4318:4318"]
    depends_on: [ tempo ]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["8085:8080"]

  nginx-exporter:
    image: nginxinc/nginx-prometheus-exporter:0.11.0
    container_name: nginx-exporter
    command: ["-nginx.scrape-uri","http://nginx:8080/nginx_status"]
    ports: ["9113:9113"]
    depends_on: [ nginx ]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["9121:9121"]
    depends_on: [ redis ]

  pg-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pg-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-app}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-apppw}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports: ["9187:9187"]
    depends_on: [ postgres ]


  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    container_name: nginxlog-exporter
    volumes:
      - ../monitoring/nginxlog.yml:/etc/nginxlog-exporter.yaml:ro
      - nginxlog_exporter_logs:/var/log/nginx:ro
    command: ["--config-file=/etc/nginxlog-exporter.yaml"]
    ports: ["4040:4040"]
    depends_on: [ nginx ]


  kafka-lag-exporter:
    image: seglo/kafka-lag-exporter:0.8.2
    container_name: kafka-lag-exporter
    environment:
      KAFKA_LAG_EXPORTER_KAFKA_BROKERS: redpanda:9092
      KAFKA_LAG_EXPORTER_REPORTERS_PROMETHEUS_PORT: "8000"
      KAFKA_LAG_EXPORTER_WHITELIST_GROUPS: ".*"
      KAFKA_LAG_EXPORTER_CLIENT_GROUPS: ".*"
      KAFKA_LAG_EXPORTER_POLL_INTERVAL: "30s"
    ports: ["9500:8000"]
    volumes:
      - ../monitoring/kafka-lag-exporter.conf:/opt/docker/conf/application.conf:ro    
    depends_on: [ redpanda ]

  burrow:
    #https://github.com/linkedin/Burrow/tree/v1.9.4
    image: burrow:1.9.4
    container_name: burrow
    volumes:
      - ../monitoring/burrow.toml:/etc/burrow/burrow.toml:ro
      - burrow_tmp:/var/tmp/burrow
    ports: ["8001:8000"]
    depends_on: [ redpanda ]

  burrow-exporter:
    image: simenduev/burrow-exporter:latest
    container_name: burrow-exporter
    environment:
      BURROW_ADDR: http://burrow:8000
    ports: ["9425:9425"]
    depends_on: [ burrow ]

volumes:
  pg_data: {}
  minio_data: {}
  nginx_cache: {}
  nginx_logs: {}
  nginxlog_exporter_logs: {}
  burrow_tmp: {}
