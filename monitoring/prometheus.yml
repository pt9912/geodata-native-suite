
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs: [{ targets: ['prometheus:9090'] }]

  - job_name: 'nginx'
    static_configs: [{ targets: ['nginx-exporter:9113'] }]

  - job_name: 'cadvisor'
    static_configs: [{ targets: ['cadvisor:8080'] }]

  - job_name: 'redis'
    static_configs: [{ targets: ['redis-exporter:9121'] }]

  - job_name: 'postgres'
    static_configs: [{ targets: ['pg-exporter:9187'] }]

  - job_name: 'redpanda'
    metrics_path: /metrics
    static_configs: [{ targets: ['redpanda:9644'] }]

  - job_name: 'search-pg'
    metrics_path: /prometheus
    static_configs: [{ targets: ['geodata-search-pg:8080'] }]

  - job_name: 'search-sqlite'
    metrics_path: /prometheus
    static_configs: [{ targets: ['geodata-search-sqlite:8080'] }]

  - job_name: 'fetch'
    metrics_path: /metrics
    static_configs: [{ targets: ['geodata-fetch:5000'] }]

  - job_name: 'nginx-access-log-derived'
    static_configs: [{ targets: ['nginxlog-exporter:4040'] }]

  - job_name: 'kafka-lag-exporter'
    static_configs: [{ targets: ['kafka-lag-exporter:8000'] }]

  - job_name: 'burrow-exporter'
    static_configs: [{ targets: ['burrow-exporter:9425'] }]
