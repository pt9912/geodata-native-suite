replicaCount: 2

image:
  repository: ghcr.io/example/nginx-stream:latest
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  clusterIssuer: "letsencrypt-dns01"
  annotations: {}
  hosts:
    - host: "replace-me.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tls-secret
      hosts: ["replace-me.example.com"]

resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits:   { cpu: "500m", memory: "512Mi" }

hpa: { enabled: true, minReplicas: 2, maxReplicas: 6, cpuUtilization: 70 }
pdb: { enabled: true, minAvailable: "50%" }

env: []        # key: value pairs
envFrom: []    # secrets/configmaps
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 5
  periodSeconds: 5
